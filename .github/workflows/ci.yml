# PR と main で、テストと lint を GitHub 上でも実行する。自動マージの条件の1つ（ジョブ名 test）。
# 型 python-cli 向け。手順は共通のアクション nosuke223/agent-workflows/ci/python-cli にある。
name: テスト

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: nosuke223/agent-workflows/ci/python-cli@main
